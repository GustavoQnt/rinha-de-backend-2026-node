services:
  app1:
    build: .
    hostname: app1
    environment:
      IVF_BLOCKS_PATH: "${IVF_BLOCKS_PATH:-/app/resources/references.ivf-blocks-K4096.bin}"
      IVF_NPROBE: "${IVF_NPROBE:-32}"
      IVF_FAST_NPROBE: "${IVF_FAST_NPROBE:-8}"
      IVF_FULL_NPROBE: "${IVF_FULL_NPROBE:-24}"
      APP_WORKERS: "${APP_WORKERS:-8}"
      SOCK_PATH: /run/rinha/rinha1.sock
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "125MB"

  app2:
    build: .
    hostname: app2
    environment:
      IVF_BLOCKS_PATH: "${IVF_BLOCKS_PATH:-/app/resources/references.ivf-blocks-K4096.bin}"
      IVF_NPROBE: "${IVF_NPROBE:-32}"
      IVF_FAST_NPROBE: "${IVF_FAST_NPROBE:-8}"
      IVF_FULL_NPROBE: "${IVF_FULL_NPROBE:-24}"
      APP_WORKERS: "${APP_WORKERS:-8}"
      SOCK_PATH: /run/rinha/rinha2.sock
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "125MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.2inst.conf:/etc/nginx/nginx.conf:ro
      - rinha-sock:/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"

volumes:
  rinha-sock:
