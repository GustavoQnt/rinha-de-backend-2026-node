services:
  app:
    build: .
    hostname: app
    environment:
      IVF_BLOCKS_PATH: "${IVF_BLOCKS_PATH:-/app/resources/references.ivf-blocks-K4096.bin}"
      IVF_FAST_NPROBE: "${IVF_FAST_NPROBE:-8}"
      IVF_FULL_NPROBE: "${IVF_FULL_NPROBE:-24}"
      APP_WORKERS: "${APP_WORKERS:-16}"
      PORT: "9999"
      SOCK_PATH: ""
      RINHA_USE_AVX2: "1"
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: "350MB"
