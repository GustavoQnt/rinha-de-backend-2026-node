services:
  app1:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app1
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "8"
      IVF_FULL_NPROBE: "32"
      APP_WORKERS: "1"
      SOCK_PATH: /run/rinha/rinha1.sock
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  app2:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app2
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "8"
      IVF_FULL_NPROBE: "32"
      APP_WORKERS: "1"
      SOCK_PATH: /run/rinha/rinha2.sock
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  lb:
    image: haproxy:2.9-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - rinha-sock:/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"

volumes:
  rinha-sock:
