services:
  app1:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app1
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "8"
      IVF_FULL_NPROBE: "32"
      APP_WORKERS: "4"
      PORT: "8081"
      SOCK_PATH: ""
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  app2:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app2
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "8"
      IVF_FULL_NPROBE: "32"
      APP_WORKERS: "4"
      PORT: "8082"
      SOCK_PATH: ""
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"
