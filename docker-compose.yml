services:
  app1:
    image: ghcr.io/gustavoqnt/gustavoqntsrv:v5882
    hostname: app1
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_BBOX_SEED: "1"
      IVF_BBOX_VISIT_CAP: "32"
      SOCK_PATH: /run/rinha/rinha1.sock
      APP_WORKERS: "2"
      RINHA_USE_AVX2: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - rinha-sock:/run/rinha
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  app2:
    image: ghcr.io/gustavoqnt/gustavoqntsrv:v5882
    hostname: app2
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_BBOX_SEED: "1"
      IVF_BBOX_VISIT_CAP: "32"
      SOCK_PATH: /run/rinha/rinha2.sock
      APP_WORKERS: "2"
      RINHA_USE_AVX2: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - rinha-sock:/run/rinha
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - rinha-sock:/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

volumes:
  rinha-sock:
