services:
  app:
    build: .
    hostname: app
    environment:
      IVF_PATH: /app/resources/references.ivf.bin
      IVF_BLOCKS_PATH: "${IVF_BLOCKS_PATH:-/app/resources/references.ivf-blocks-K4096.bin}"
      IVF_NPROBE: "${IVF_NPROBE:-32}"
      IVF_FAST_NPROBE: "${IVF_FAST_NPROBE:-}"
      IVF_FULL_NPROBE: "${IVF_FULL_NPROBE:-}"
      APP_WORKERS: "${APP_WORKERS:-4}"
      SOCK_PATH: /run/rinha/rinha.sock
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    deploy:
      resources:
        limits:
          cpus: "1.30"
          memory: "300MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - rinha-sock:/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"

volumes:
  rinha-sock:
