services:
  app1:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app1
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "4"
      IVF_FULL_NPROBE: "12"
      APP_WORKERS: "1"
      SOCK_PATH: /run/rinha/rinha1.sock
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  app2:
    image: ghcr.io/gustavoqnt/rinha-2026-rust:latest
    hostname: app2
    environment:
      IVF_BLOCKS_PATH: "/app/resources/references.ivf-blocks-K4096.bin"
      IVF_FAST_NPROBE: "4"
      IVF_FULL_NPROBE: "12"
      APP_WORKERS: "1"
      SOCK_PATH: /run/rinha/rinha2.sock
      USE_MONOIO: "1"
      RINHA_USE_AVX2: "1"
    volumes:
      - rinha-sock:/run/rinha
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - rinha-sock:/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - app1
      - app2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  rinha-sock:
