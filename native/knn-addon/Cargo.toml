[package]
name = "knn_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4"] }
napi-derive = "2.16.13"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
