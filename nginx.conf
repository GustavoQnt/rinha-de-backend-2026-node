worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream api {
        server app1:8081;
        server app2:8082;
    }

    server {
        listen 9999 reuseport;
        client_max_body_size 4k;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass http://api;
        }
    }
}
